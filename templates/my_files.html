<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Files - PrivateVault</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .file-card {
            background: white;
            padding: 18px;
            margin-bottom: 15px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-name {
            font-size: 18px;
            font-weight: bold;
        }

        .file-date {
            color: #777;
            font-size: 13px;
            margin-top: 5px;
        }

        .buttons a {
            text-decoration: none;
            padding: 9px 14px;
            border-radius: 7px;
            margin-left: 8px;
            color: white;
        }

        .download {
            background: #007bff;
        }

        .delete {
            background: #dc3545;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #007bff;
        }

        .empty {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="container">

    <a href="{{ url_for('dashboard') }}" class="back">
        ← Back to Dashboard
    </a>

    <h1>📁 My Files</h1>


    <form method="GET" action="{{ url_for('my_files') }}" style="margin-bottom: 25px;">
        <input
            type="text"
            name="search"
            placeholder="🔍 Search files..."
            value="{{ search }}"
            style="
                width: 100%;
                padding: 14px;
                border: 1px solid #ddd;
                border-radius: 10px;
                font-size: 16px;
                box-sizing: border-box;
            "
        >
    </form>
    {% if files %}

        {% for file in files %}

        <div class="file-card">

            <div>
                <div class="file-name">
                    📄 {{ file.filename }}
                </div>

                {% if file.upload_date %}
                <div class="file-date">
                    Uploaded: {{ file.upload_date }}
                </div>
                {% endif %}
            </div>

            <div class="buttons">

                <a href="{{ url_for('download_file', file_id=file._id) }}"
                   class="download">
                    Download
                </a>

                <a href="{{ url_for('delete_file', file_id=file._id) }}"
                   class="delete"
                   onclick="return confirm('Are you sure you want to delete this file?');">
                    Delete
                </a>

            </div>

        </div>

        {% endfor %}

    {% else %}

        <div class="empty">
            <h2>📂 No files found</h2>
            <p>You haven't uploaded any files yet.</p>
        </div>

    {% endif %}

</div>

</body>
</html>
