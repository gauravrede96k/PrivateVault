<!DOCTYPE html>
<html>
<head>
    <title>PrivateVault - Register</title>
</head>

<body>

    <h2>🔐 PrivateVault</h2>

    <h3>Create Account</h3>

    <form method="POST">

        <input
            type="text"
            name="name"
            placeholder="Full Name"
            required
        >

        <br><br>

        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >

        <br><br>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <br><br>

        <button type="submit">
            Register
        </button>

    </form>

    <p>
        Already have an account?
        <a href="/login">Login</a>
    </p>

</body>
</html>
